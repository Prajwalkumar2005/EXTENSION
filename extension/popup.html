<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>YouTube Desktop Lyrics Overlay</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

    body {
      width: 300px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(145deg, #0d0d12, #181824);
      color: #ffffff;
      margin: 0;
      padding: 16px;
      overflow-x: hidden;
      box-sizing: border-box;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .title-group h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      background: linear-gradient(90deg, #ff334b, #ff8c00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }

    .title-group p {
      margin: 2px 0 0;
      font-size: 11px;
      color: #8f92a1;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fcc419;
      white-space: nowrap;
    }

    .status-badge.connected {
      color: #40c057;
      border-color: rgba(64, 192, 87, 0.3);
      background: rgba(64, 192, 87, 0.1);
    }

    .status-badge.offline {
      color: #ff6b6b;
      border-color: rgba(255, 107, 107, 0.3);
      background: rgba(255, 107, 107, 0.1);
    }

    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      backdrop-filter: blur(12px);
    }

    .form-group {
      margin-bottom: 10px;
    }
    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 10.5px;
      font-weight: 700;
      color: #9ea2b6;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    input[type="text"], select {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      border-radius: 6px;
      font-size: 12px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus, select:focus {
      border-color: #ff334b;
      box-shadow: 0 0 8px rgba(255, 51, 75, 0.3);
    }

    .btn-primary {
      width: 100%;
      padding: 9px;
      background: linear-gradient(90deg, #e50914, #ff5252);
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.4px;
      transition: all 0.15s ease;
      box-shadow: 0 4px 12px rgba(229, 9, 20, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(229, 9, 20, 0.45);
    }

    .btn-secondary {
      width: 100%;
      padding: 7px;
      margin-top: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #ddd;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 11px;
      transition: all 0.15s ease;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      background: transparent;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 14px;
      width: 14px;
      border-radius: 50%;
      background: #ff334b;
      cursor: pointer;
      margin-top: -5px;
      box-shadow: 0 0 8px rgba(255, 51, 75, 0.6);
    }

    input[type="range"]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
    }

    .val-display {
      font-size: 11px;
      font-weight: 700;
      color: #ff9800;
      min-width: 34px;
      text-align: right;
    }

    .status-msg {
      font-size: 11px;
      margin-top: 8px;
      text-align: center;
      min-height: 16px;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .status-msg.visible {
      opacity: 1;
    }

    .footer-hint {
      text-align: center;
      font-size: 10px;
      color: #6c7086;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  
  <div class="header">
    <div class="title-group">
      <h2>YT LYRICS OVERLAY</h2>
      <p>Desktop Live Subtitles</p>
    </div>
    <div class="status-badge" id="status-badge">
      <span>●</span> <span id="badge-text">Connecting</span>
    </div>
  </div>

  <div class="card">
    <div class="form-group">
      <label for="token">Pairing Auth Token</label>
      <input type="text" id="token" placeholder="Paste desktop token...">
    </div>
    <button class="btn-primary" id="save-token">Connect Bridge</button>
    <button class="btn-secondary" id="test-btn">🎵 Send Test Caption</button>
    <div class="status-msg" id="status"></div>
  </div>

  <div class="card">
    <div class="form-group">
      <label for="style-select">Visual Typography Style</label>
      <select id="style-select">
        <option value="poster">Cinematic Poster (Dual-Line)</option>
        <option value="neon">Neon Glow (Cyan/Pink)</option>
        <option value="minimal">Minimalist (Clean White)</option>
        <option value="classic">Classic Subtitle (Yellow)</option>
        <option value="classic_white">Classic Subtitle (White)</option>
        <option value="cyberpunk">Cyberpunk (Cyan/Pink)</option>
        <option value="gold">Luxury Gold</option>
        <option value="hacker">Hacker Green</option>
        <option value="blood">Blood Red</option>
        <option value="ocean">Ocean Blue</option>
        <option value="sunset">Sunset Orange</option>
        <option value="ghost">Ghost White</option>
        <option value="vaporwave">Vaporwave (Purple)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="size-slider">Base Font Size</label>
      <div class="slider-container">
        <input type="range" id="size-slider" min="16" max="72" value="34">
        <div class="val-display" id="size-val">34px</div>
      </div>
    </div>

    <div class="form-group">
      <label for="color-picker">Accent Glow Color</label>
      <div class="color-container" style="display: flex; align-items: center; gap: 8px;">
        <input type="color" id="color-picker" value="#FFD700" style="width: 36px; height: 26px; padding: 0; border: none; background: transparent; cursor: pointer; border-radius: 4px;">
        <span class="color-hex" id="color-val" style="font-size: 11px; font-weight: 700; color: #aaa; font-family: monospace;">#FFD700</span>
      </div>
    </div>
  </div>

  <div class="card" style="margin-bottom: 8px;">
    <label style="margin-bottom: 8px;">Live Typography Preview</label>
    <div id="preview-box" style="background: rgba(0,0,0,0.5); border: 1px dashed rgba(255,255,255,0.15); border-radius: 6px; padding: 12px; text-align: center; min-height: 48px; display: flex; flex-direction: column; justify-content: center;">
      <div id="prev-line1" style="font-size: 14px; font-weight: 800; color: #FBC02D; text-shadow: 0 0 6px rgba(255,0,0,0.5);">NEVER GONNA GIVE YOU UP</div>
      <div id="prev-line2" style="font-size: 12px; font-weight: 600; color: #FFFFFF; margin-top: 2px;">Never gonna let you down 🎵</div>
    </div>
  </div>

  <div class="footer-hint">
    Play any YouTube video with CC enabled 🎵
  </div>

  <script src="popup.js"></script>
</body>
</html>
