<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>YT Caption Overlay</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

    body {
      width: 280px;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f0f14, #1c1c28);
      color: #ffffff;
      margin: 0;
      padding: 16px;
      overflow-x: hidden;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      background: linear-gradient(90deg, #ff0000, #ff8c00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }
    .header p {
      margin: 4px 0 0;
      font-size: 11px;
      color: #8888aa;
    }

    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      backdrop-filter: blur(10px);
    }

    .form-group {
      margin-bottom: 12px;
    }
    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #aaaacc;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"], select {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      border-radius: 6px;
      font-size: 12px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus, select:focus {
      border-color: #ff0000;
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      background: transparent;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 14px;
      width: 14px;
      border-radius: 50%;
      background: #ff0000;
      cursor: pointer;
      margin-top: -5px;
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
    }
    input[type="range"]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }
    .val-display {
      font-size: 11px;
      font-weight: 600;
      color: #ff8c00;
      width: 32px;
      text-align: right;
    }

    button {
      width: 100%;
      padding: 10px;
      background: linear-gradient(90deg, #d32f2f, #f44336);
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.5px;
      transition: transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(244, 67, 54, 0.3);
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(244, 67, 54, 0.5);
    }
    button:active {
      transform: translateY(1px);
    }

    .status {
      font-size: 11px;
      margin-top: 10px;
      text-align: center;
      color: #4caf50;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .status.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  
  <div class="header">
    <h2>CAPTION OVERLAY</h2>
    <p>Live Desktop Lyrics Bridge</p>
  </div>

  <div class="card">
    <div class="form-group">
      <label for="token">Authentication Token</label>
      <input type="text" id="token" placeholder="Paste token here...">
    </div>
    <button id="save-token">Connect Bridge</button>
    <div class="status" id="status">Token saved!</div>
  </div>

  <div class="card">
    <div class="form-group">
      <label for="style-select">Visual Style</label>
      <select id="style-select">
        <option value="poster">Cinematic Poster</option>
        <option value="neon">Neon Glow</option>
        <option value="minimal">Minimalist</option>
      </select>
    </div>

    <div class="form-group">
      <label for="size-slider">Base Font Size</label>
      <div class="slider-container">
        <input type="range" id="size-slider" min="16" max="72" value="38">
        <div class="val-display" id="size-val">38px</div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
